[project]
name = "reconcile"
version = "0.1.0"
description = "Reconcile two Parquet files by keys and export detail plus optional per-input all-data outputs."
requires-python = "==3.12.*"
dependencies = [
    "duckdb==1.5.2",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "pandas>=2.1",
    "pyarrow>=15",
    "typer>=0.12",
    "xlsxwriter>=3.2",
]

[project.scripts]
reconcile = "reconcile.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.envs.default.env-vars]
PYTHONPATH = "src:../.."
