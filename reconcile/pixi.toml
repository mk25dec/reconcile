[workspace]
name = "reconcile"
version = "0.1.0"
description = "Reconcile two Parquet files by keys and export detail plus optional per-input all-data outputs."
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "==3.12.13"
duckdb = "==1.5.2"

[pypi-dependencies]
typer = ">=0.12"
pandas = ">=2.1"
numpy = ">=1.26"
pyarrow = ">=15"
xlsxwriter = ">=3.2"
openpyxl = ">=3.1"

[tasks]
reconcile = "python -m reconcile.cli compare"
help = "python -m reconcile.cli compare --help"
version = "python -m reconcile.cli --version"

[activation.env]
PYTHONPATH = "src:../.."
